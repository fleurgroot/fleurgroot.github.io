---
layout: default
title: "blog"
heading: "blog"
intro: "Latest greatest"
---
<ul class="post-list mobile-spanAll tablet-spanAll">
    {% for post in site.posts %}
        <li>
            <span class="long-dash"></span><a href="{{ post.url }}">{{ post.title }}</a><br>
            {{ post.date | date: "%-d %B %Y" }}
        </li>
    {% endfor %}
</ul>
